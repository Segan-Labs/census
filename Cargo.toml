[workspace]
resolver = "2"
members = [
    "crates/census-core",
    "crates/census-collectors",
    "crates/census-protocol",
    "crates/censusd",
    "crates/census-widgets",
    "crates/census-layout",
    "crates/census-render",
    "crates/census",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
dirs = "5"
census-core = { path = "crates/census-core" }
census-collectors = { path = "crates/census-collectors" }
census-protocol = { path = "crates/census-protocol" }
census-widgets = { path = "crates/census-widgets" }
census-layout = { path = "crates/census-layout" }
census-render = { path = "crates/census-render" }
